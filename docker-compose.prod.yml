name: mordren-loikmon

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: loikmon-server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    expose:
      - "4000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=mordren-loikmon_internal
      - "traefik.http.routers.loikmon-api.rule=Host(`${API_DOMAIN}`)"
      - traefik.http.routers.loikmon-api.entrypoints=websecure
      - traefik.http.routers.loikmon-api.tls.certresolver=letsencrypt
      - traefik.http.routers.loikmon-api.service=loikmon-api-svc
      - traefik.http.services.loikmon-api-svc.loadbalancer.server.port=4000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mordren-loikmon_internal
      - internal

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_BASE: /
        VITE_API_BASE: /api
    container_name: loikmon-web
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=mordren-loikmon_internal
      - "traefik.http.routers.loikmon-app.rule=Host(`${APP_DOMAIN}`)"
      - traefik.http.routers.loikmon-app.entrypoints=websecure
      - traefik.http.routers.loikmon-app.tls.certresolver=letsencrypt
      - traefik.http.routers.loikmon-app.service=loikmon-app-svc
      - traefik.http.services.loikmon-app-svc.loadbalancer.server.port=80
    depends_on:
      server:
        condition: service_healthy
    networks:
      - mordren-loikmon_internal
      - internal

networks:
  mordren-loikmon_internal:
    external: true
  internal:
    driver: bridge
