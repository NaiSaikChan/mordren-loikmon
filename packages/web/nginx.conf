server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target: cheap, never cached, and independent of the
    # SPA markup (grepping index.html broke whenever the shell changed).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|svg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Loikmon backend (packages/backend): /api/v1 REST + /api/auth email links
    location ^~ /api/ {
        # Docker's embedded DNS, re-resolved per request: a literal host in
        # proxy_pass is resolved once at startup, so nginx refuses to boot if
        # the backend is down and keeps a stale IP after it is recreated.
        resolver           127.0.0.11 valid=10s ipv6=off;
        set $backend_host  backend;
        proxy_pass         http://$backend_host:4001$request_uri;
        client_max_body_size 10m;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The SPA shell must always revalidate, otherwise browsers heuristically
    # cache it and keep loading the previous build's hashed assets after a
    # redeploy. The assets themselves stay immutable.
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
