# ============================================================================
# Local development infra — MySQL + MinIO only.
# Run the backend itself with `npm run dev -w @loikmon/backend`.
#
#   docker compose -f packages/backend/docker-compose.dev.yml up -d
# ============================================================================
name: loikmon-backend-dev

services:
  mysql:
    image: mysql:8.4
    container_name: loikmon-mysql-dev
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: loikmon
      MYSQL_USER: loikmon
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: loikmon-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_dev:/data

volumes:
  mysql_dev:
  minio_dev:
